name: Publish Base Image

on:
  push:
    branches: [main]
    paths:
      - 'docker/base.Dockerfile'
      - 'docker/base.version'
      - 'standards/**'
      - 'scripts/**'
      - '.github/workflows/publish-base.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: agh-logic-unit/alu-base

jobs:
  build-base:
    name: Build & Push alu-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Version
        id: version
        run: |
          VER=$(tr -d '[:space:]' < docker/base.version)
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          MAJOR_MINOR=$(echo "$VER" | cut -d. -f1,2)
          echo "major_minor=${MAJOR_MINOR}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major_minor }}
            type=sha,format=short

      - name: Build and Push OCI Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/base.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=alu-base
          cache-to: type=gha,scope=alu-base,mode=max

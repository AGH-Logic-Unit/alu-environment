name: Publish RTL Image

on:
  push:
    branches: [main]
    paths:
      - 'docker/rtl.Dockerfile'
      - 'docker/rtl.version'
      - '.github/workflows/publish-rtl.yml'
  workflow_run:
    workflows: ["Publish Base Image"]
    types: [completed]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: agh-logic-unit/alu-rtl

jobs:
  build-rtl:
    name: Build & Push alu-rtl
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Versions
        id: version
        run: |
          RTL_VER=$(tr -d '[:space:]' < docker/rtl.version)
          BASE_VER=$(tr -d '[:space:]' < docker/base.version)
          BASE_MM=$(echo "$BASE_VER" | cut -d. -f1,2)
          echo "rtl_version=${RTL_VER}" >> "$GITHUB_OUTPUT"
          echo "composite_tag=${BASE_MM}-rtl.${RTL_VER}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.rtl_version }}
            type=raw,value=${{ steps.version.outputs.composite_tag }}
            type=sha,format=short

      - name: Build and Push OCI Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/rtl.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RTL_VERSION=${{ steps.version.outputs.rtl_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=alu-rtl
          cache-to: type=gha,scope=alu-rtl,mode=max

# AGH Logic Unit - Official Ruff Python Configuration for Cocotb & Tools

target-version = "py312"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # Line length handled by formatter
    "B008", # Do not perform function calls in argument defaults (cocotb idioms)
]

[lint.isort]
known-first-party = ["cocotb", "cocotb_test"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
